experiment_id: exp2_external_video_aug_shufflenet_v2_x1_0
model: shufflenet_v2_x1_0
task: classification
dataset:
  name: printing-errors+verified-external-frames
  version: '1.0'
  data_dir: datasets/processed/external-aug-exp2
  image_size: 224
  source_mode: directory
  split_ratios:
  - 0.7
  - 0.15
  - 0.15
data:
  num_workers: 4
  batch_size: 32
  pin_memory: true
train:
  epochs: 30
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  augmentation:
    horizontal_flip: true
    random_rotation: 15
    color_jitter: 0.2
    random_crop: false
    normalize: true
  precision: fp32
  seed: 42
  early_stopping_patience: 10
evaluation:
  metrics:
  - precision
  - recall
  - f1
  - fnr
  - fpr
  - auroc
  decision_threshold: 0.5
export:
  format: onnx
  quantization: int8
  dynamic_axes: false
hardware:
  machine: arm64 (arm)
  gpu: None
software:
  python: 3.11.15
  torch: !!python/object/new:torch.torch_version.TorchVersion
  - 2.14.0
  torchvision: 0.29.0
  ultralytics: 8.4.138
  opencv: 5.0.0
  os: Darwin 25.6.0
created_at: '2026-09-06T11:58:38.312317'
notes: 'Experiment 2A: external video-frames augmentation. Identical training setup
  to

  the baseline (shufflenet_v2_x1_0_printing-errors_cdc9e2cad4, seed 42, epochs 30).

  dataset.data_dir (datasets/processed/external-aug-exp2) is a DERIVED split dir

  created by `tv exp2-prep`: train.csv = printing-errors train + 44 verified

  external FAILING frames (NORMAL001 stringing + SP001 spaghetti, merged human

  review); val.csv/test.csv are byte-for-byte copies of the frozen printing-errors

  splits. UE003 normal frames are evaluation-only (external normal eval), never in

  training. Derived manifest: datasets/processed/external-aug-exp2/derived_manifest.json.'
