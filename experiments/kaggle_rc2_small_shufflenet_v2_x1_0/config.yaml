experiment_id: kaggle_rc2_small_shufflenet_v2_x1_0
model: shufflenet_v2_x1_0
task: classification
dataset:
  name: kaggle-early-detection-rc2
  version: '1.0'
  data_dir: /Users/alex/tinyvision-data/kaggle-rc2-experiment
  image_size: 224
  source_mode: csv
  split_ratios:
  - 0.7
  - 0.15
  - 0.15
data:
  num_workers: 4
  batch_size: 32
  pin_memory: true
train:
  epochs: 5
  optimizer: adam
  learning_rate: 0.0005
  weight_decay: 0.0001
  augmentation:
    horizontal_flip: true
    random_rotation: 10
    color_jitter: 0.2
    random_crop: true
    normalize: true
  precision: fp32
  seed: 42
  early_stopping_patience: 3
evaluation:
  metrics:
  - precision
  - recall
  - f1
  - fnr
  - fpr
  - auroc
  decision_threshold: 0.5
export:
  format: onnx
  quantization: int8
  dynamic_axes: false
hardware:
  machine: arm64 (arm)
  gpu: None
software:
  python: 3.11.15
  torch: 2.14.0
  torchvision: 0.29.0
  ultralytics: 8.4.138
  opencv: 5.0.0
  os: Darwin 27.0.0
created_at: '2026-10-14T19:38:34.452308'
notes: Small reproducible RC2 experiment using Kaggle print-level labels (printer-disjoint).
  Research-only/non-redistributable data.
