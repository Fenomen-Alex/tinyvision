# Experiment 4 — Target-domain failure-balancing training augmentation (Stage 14).
# Same binary architecture/hyperparameters as the Experiment-1 baseline
# (shufflenet_v2_x1_0, seed 42, epochs 30) on printing-errors train + the
# 333 verified normal frames from Stage 13 + a small (142-frame) target-domain
# FAILURE set gathered from 2 independent fixed-camera source videos.
#
# question: does adding a small amount of diverse target-domain FAILURE data,
# on top of the Stage-13 target-domain normal augmentation, restore failure
# sensitivity that was lost when the model became normal-biased?
#
# dataset.data_dir (datasets/processed/external-aug-exp4-balanced) is a DERIVED
# split dir:
#   train.csv = printing-errors train + 333 Stage-13 target-domain NORMAL frames
#               (absolute paths) + 142 Stage-14 target-domain FAILING frames
#               (absolute paths, continuous failure windows, 2 sources).
#   val.csv/test.csv are byte-identical copies of frozen printing-errors splits.
# External normal eval holdout = 2 sources (LY3jlcO34f4, zkJgLanCSUw), 120
# frames, evaluation-only, never in training.
experiment_id: exp4_target_balanced_shufflenet_v2_x1_0
model: shufflenet_v2_x1_0
task: classification
dataset:
  name: printing-errors+stage13-normal+stage14-failure
  version: '1.0'
  data_dir: datasets/processed/external-aug-exp4-balanced
  image_size: 224
  source_mode: directory
  split_ratios: [0.7, 0.15, 0.15]
data:
  num_workers: 4
  batch_size: 32
  pin_memory: true
train:
  epochs: 30
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  augmentation:
    horizontal_flip: true
    random_rotation: 15
    color_jitter: 0.2
    random_crop: false
    normalize: true
  precision: fp32
  seed: 42
  early_stopping_patience: 10
evaluation:
  metrics: [precision, recall, f1, fnr, fpr, auroc]
  decision_threshold: 0.5
export:
  format: onnx
  quantization: int8
  dynamic_axes: false
hardware:
  machine: ''
  gpu: ''
software:
  python: ''
  torch: ''
  torchvision: ''
  ultralytics: ''
  opencv: ''
  os: ''
created_at: ''
notes: |-
  Experiment 4: target-domain failure-balancing augmentation. Identical training
  setup to the baseline and Exp3. Adds 142 target-domain FAILING frames (2
  independent fixed-cam sources: ZYfXW0JN2k4 spaghetti, 3zXQrw0E-Ag blob) to the
  Stage-13 normal-augmented mix. Key question: does a small diverse failure set
  restore failure sensitivity without losing the Stage-13 normal FP improvement?
  All evaluations use the validated config (sample-fps 1, warmup 8, confirm 2,
  threshold 0.5); no threshold tuning. Failure labels are VLM-screened
  (pending human review).
