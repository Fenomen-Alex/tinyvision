# PLANNED (not run). rc2 real-domain candidate trained on weak/VLM-labelled
# internet footage reconstructed by the automated pipeline.
#
# Pipeline (see docs/superpowers/plans/2026-10-14-real-domain-automated-pipeline.md):
#   tv acquire    --sources <sources.yaml> --cache-dir datasets/external-cache
#   tv autolabel  --manifest datasets/external-cache/manifest.json
#   tv streams    --manifest datasets/external-cache/manifest.json \
#                 --proposals datasets/external-cache/autolabel.json \
#                 --split-dir datasets/external-cache/rc2-realdomain/splits \
#                 --data-dir datasets/external-cache/rc2-realdomain
#   tv train      --config training/configs/planned/rc2_realdomain.yaml
#
# Labels are WEAK (video-title keywords) or VLM proposals. They are not
# human-verified; quality is reported honestly, never assumed.
experiment_id: rc2_realdomain_shufflenet_v2_x1_0
model: shufflenet_v2_x1_0
task: classification
dataset:
  name: release-candidate-2-realdomain
  version: '1.0'
  data_dir: datasets/external-cache/rc2-realdomain
  image_size: 224
  source_mode: directory
  split_ratios: [0.7, 0.15, 0.15]
data:
  num_workers: 4
  batch_size: 32
  pin_memory: true
train:
  epochs: 30
  optimizer: adam
  learning_rate: 0.0005
  weight_decay: 0.0001
  augmentation:
    horizontal_flip: true
    random_rotation: 15
    color_jitter: 0.3
    random_crop: true
    normalize: true
  precision: fp32
  seed: 42
  early_stopping_patience: 8
evaluation:
  metrics: [precision, recall, f1, fnr, fpr, auroc]
  decision_threshold: 0.5
export:
  format: onnx
  quantization: int8
  dynamic_axes: false
created_at: ''
notes: |-
  PLANNED, NOT RUN. Trains only on real, in-domain footage reconstructed from
  public video, labelled weakly (title) / by VLM. Primary hypothesis: in-domain
  real frames reduce the normal-source false-alarm rate that RC1 exhibited
  (FPR=1.0) without collapsing recall. Splits are source-grouped (no stream
  spans train/val/test). Evaluation uses training/configs/reliability/suite-realdomain.yaml;
  it does NOT replace the release policy floors.
