# Release candidate 1 (rc1) — first training run on the release dataset.
# Same binary architecture / hyperparameters as the established frozen baseline
# and Exp3/Exp4 (shufflenet_v2_x1_0, 224, adam 1e-3, epochs 30, seed 42,
# decision_threshold 0.5). The ONLY deliberate difference is the training
# dataset, which is the provenance-typed release composition:
#
#   train.csv = frozen printing-errors train rows (source annotations)
#             + Trier train-environment frames (source_annotation: Trier FFF-QC
#               v2 folder-level labels, CC BY 4.0, Zenodo 18628777) — 15 envs,
#               9 failing (extrusion_error 3, layer_shift 3, stringing 3) +
#               6 normal; test_data holdout environments excluded
#             + 44 human-verified failing frames (NORMAL001/SP001,
#               provenance human_reviewed).
#   val/test.csv = byte-identical copies of the frozen printing-errors splits.
#
# Excluded (label policy): Trier VLM proposals, Stage-13 VLM-screened normals,
# Stage-14 VLM-screened failures, UE003 external eval frames. No VLM-only
# labels anywhere in this training set.
#
# Provenance ledger: datasets/processed/release-rc1/derived_manifest.json
# (sha256 of the Trier env manifest + sample files + frozen splits).
experiment_id: rc1_release_candidate_shufflenet_v2_x1_0
model: shufflenet_v2_x1_0
task: classification
dataset:
  name: release-candidate-1
  version: '1.0'
  data_dir: datasets/processed/release-rc1
  image_size: 224
  source_mode: directory
  split_ratios: [0.7, 0.15, 0.15]
data:
  num_workers: 4
  batch_size: 32
  pin_memory: true
train:
  epochs: 30
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  augmentation:
    horizontal_flip: true
    random_rotation: 15
    color_jitter: 0.2
    random_crop: false
    normalize: true
  precision: fp32
  seed: 42
  early_stopping_patience: 10
evaluation:
  metrics: [precision, recall, f1, fnr, fpr, auroc]
  decision_threshold: 0.5
export:
  format: onnx
  quantization: int8
  dynamic_axes: false
hardware:
  machine: ''
  gpu: ''
software:
  python: ''
  torch: ''
  torchvision: ''
  ultralytics: ''
  opencv: ''
  os: ''
created_at: ''
notes: |-
  Release candidate 1. Training on the provenance-typed release dataset
  (printing-errors frozen + Trier source_annotation train envs + human-verified
  NORMAL001/SP001). No VLM-only labels. val/test byte-identical frozen.
  Hyperparameters identical to the established baseline/Exp3/Exp4; threshold
  0.5 preserved (no tuning).